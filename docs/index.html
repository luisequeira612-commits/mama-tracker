<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160d19">
  <title>MAMA 2026 · Ranking de actuaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #160d19;
      --bg2: #2b1429;
      --gold: #ff5b91;
      --white: #fff3f8;
      --muted: #c3a8bb;
      --line: #4a2944;
      --card: rgba(43, 22, 43, .82);
      --accent-soft: #c78bff;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background:
        radial-gradient(circle at 18% 8%, rgba(255,91,145,.10) 0 1px, transparent 2px),
        radial-gradient(circle at 72% 24%, rgba(199,139,255,.08) 0 1px, transparent 2px),
        radial-gradient(circle at 38% 58%, rgba(255,243,248,.05) 0 1px, transparent 2px),
        radial-gradient(ellipse at 85% 0%, rgba(199,139,255,.12), transparent 42%), linear-gradient(145deg, var(--bg), var(--bg2));
      background-size: 137px 151px, 191px 173px, 223px 199px, auto;
      font-family: Inter, system-ui, sans-serif;
    }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 56px; }
    header { text-align: left; }
    h1 {
      margin: 0;
      font: 600 clamp(40px, 10vw, 54px)/.92 "Cormorant Garamond", serif;
      letter-spacing: -.025em;
    }
    h1 em { font-style: italic; }
    .credit { display: inline-block; vertical-align: middle; margin-left: 5px; color: var(--muted); font: 400 9px/1.4 Inter, system-ui, sans-serif; letter-spacing: 0; }
    .credit a { color: inherit; text-decoration: none; }
    .credit a:hover { color: var(--white); text-decoration: underline; }
    .meta { margin: 14px 0 4px; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
    .updated { color: var(--gold); font: 500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .demo {
      display: inline-block;
      margin-top: 10px;
      color: var(--gold);
      font-size: 11px;
      border: 1px solid rgba(226,185,91,.45);
      border-radius: 999px;
      padding: 4px 8px;
    }
    #app { margin-top: 28px; }
    .error {
      border: 1px solid #9c5862;
      background: rgba(85, 35, 51, .55);
      border-radius: 12px;
      padding: 16px;
      color: var(--white);
      font-size: 14px;
    }
    .top {
      border: 1px solid rgba(255,91,145,.55);
      border-radius: 14px;
      padding: 16px 18px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(0,0,0,.16);
    }
    .topline { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .no { flex: 0 0 auto; padding: 6px 9px; border-radius: 8px; color: #fff; background: var(--gold); font: 700 13px/1 Inter, sans-serif; white-space: nowrap; }
    .artist { min-width: 0; flex: 1; margin: 0; color: var(--gold); font: italic 700 clamp(23px, 6vw, 34px)/1.05 "Cormorant Garamond", serif; text-align: left; overflow-wrap: anywhere; }
    .views {
      margin-top: 12px;
      font: 600 clamp(32px, 8vw, 42px)/1 "Cormorant Garamond", serif;
      letter-spacing: -.02em;
    }
    .views span { color: var(--muted); font: 500 16px Inter, sans-serif; letter-spacing: 0; }
    .detail { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .thumbs { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: thin; }
    .thumb {
      display: block;
      flex: 0 0 calc((100% - 8px) / 2);
      min-width: 0;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #20264c;
      border: 1px solid rgba(226,185,91,.35);
    }
    .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .rows { margin-top: 18px; }
    .row {
      position: relative;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 78px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .rank { font: 600 25px "Cormorant Garamond", serif; color: var(--muted); }
    .rowname { min-width: 0; }
    .rowartist { font: italic 600 22px/1.05 "Cormorant Garamond", serif; overflow-wrap: anywhere; }
    .rowdetail { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .right { display: flex; align-items: center; gap: 10px; }
    .mini-thumbs { display: flex; gap: 5px; max-width: 150px; overflow: hidden; }
    .mini { width: 54px; aspect-ratio: 16/9; object-fit: cover; border-radius: 5px; background: #20264c; }
    .rowviews { min-width: 95px; text-align: right; font: 600 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .barwrap { grid-column: 2 / -1; height: 4px; background: #3a416e; border-radius: 99px; overflow: hidden; }
    .bar { height: 100%; width: 0; background: var(--gold); border-radius: inherit; transition: width 900ms ease; }
    .top-share-track { height: 5px; margin-top: 10px; background: #3a416e; border-radius: 99px; overflow: hidden; }
    .top-share-fill { height: 100%; background: var(--gold); border-radius: inherit; }
    .growth-note { margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .artist { display: flex; flex-direction: column; gap: 4px; }
    .artist-name { color: var(--gold); font: italic 700 clamp(23px, 6vw, 34px)/1.05 "Cormorant Garamond", serif; overflow-wrap: anywhere; }
    .artist-growth, .row-growth { color: #63d68b; font: 500 10px/1.35 Inter, system-ui, sans-serif; letter-spacing: 0; }
    .growth-negative { color: #e58a9a; }
    .growth-neutral { color: var(--muted); }
    .row-growth { margin-top: 4px; }
    .collabs { margin-top: 30px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .collabs h2 { margin: 0; color: var(--gold); font: italic 600 27px/1.1 "Cormorant Garamond", serif; }
    .collabs-intro { margin: 6px 0 14px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .collab-row { padding: 11px 0; border-top: 1px solid var(--line); }
    .collab-row:first-of-type { border-top: 0; }
    .collab-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
    .collab-meta strong:last-child { color: var(--gold); white-space: nowrap; }
    .collab-title { display: block; margin-top: 5px; color: var(--white); font-size: 11px; line-height: 1.45; text-decoration: none; overflow-wrap: anywhere; }
    .collab-title:hover { text-decoration: underline; }
    .collab-views { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .collab-barwrap { height: 4px; margin-top: 8px; background: #3a416e; border-radius: 99px; overflow: hidden; }
    .collab-bar { height: 100%; background: var(--accent-soft); border-radius: inherit; }
    .focus:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .footer { margin-top: 28px; color: var(--muted); font-size: 11px; text-align: center; }
    @media (max-width: 600px) {
      main { width: min(760px, calc(100% - 28px)); padding-top: 28px; }
      .top { padding: 14px; }
      .topline { gap: 9px; }
      .artist { font-size: clamp(22px, 6.2vw, 29px); }
      .views { font-size: clamp(30px, 8vw, 38px); }
      .row { grid-template-columns: 38px minmax(0, 1fr); }
      .right { grid-column: 2; justify-content: space-between; }
      .mini-thumbs { display: none; }
      .rowviews { text-align: left; min-width: 0; }
      .barwrap { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar { transition: none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1><em>MAMA 2026</em> <span style="font:500 .42em Inter,sans-serif;letter-spacing:0;color:var(--muted)">RANKING</span> <span class="credit">Sitio web creado por Luis Sequeira · Twitter: <a href="https://twitter.com/cryforasa" target="_blank" rel="noopener">@cryforasa</a></span></h1>
    <div id="meta" class="meta">Cargando datos…</div>
    <div id="updated" class="updated">—</div>
    <div id="growth-note" class="growth-note">Crecimiento de vistas por artista · estimación de la última hora</div>
    <div id="demo" class="demo" hidden>Datos de ejemplo</div>
  </header>
  <section id="app" aria-live="polite"></section>
  <div class="footer">Datos acumulados cada 15 min · crecimiento horario cada hora · página refresca cada 5 min</div>
</main>
<script>
(() => {
  const app = document.querySelector("#app");
  const meta = document.querySelector("#meta");
  const updated = document.querySelector("#updated");
  const growthNote = document.querySelector("#growth-note");
  const demo = document.querySelector("#demo");
  const nf = new Intl.NumberFormat("en-US");

  function growthText(value) {
    const amount = Number(value) || 0;
    const sign = amount < 0 ? "−" : "+";
    const arrow = amount < 0 ? "↘" : amount > 0 ? "↗" : "→";
    return arrow + " " + sign + nf.format(Math.abs(amount)) + " vistas en la última hora";
  }

  function detail(act) {
    const songs = act.songs === 1 ? "canción" : "canciones";
    const videos = act.videos === 1 ? "vídeo" : "vídeos";
    let text = `${act.songs} ${songs} · ${act.videos} ${videos}`;
    if (act.collabs > 0) text += ` · ${act.collabs} ${act.collabs === 1 ? "colaboración" : "colaboraciones"}`;
    return text;
  }

  // Largest-remainder allocation: rounded labels always add up to exactly 100.0%.
  function allocatePercentageTenths(values, total) {
    if (!(total > 0)) return values.map(() => 0);
    const raw = values.map(value => Math.max(0, Number(value) || 0) * 1000 / total);
    const allocated = raw.map(Math.floor);
    let remaining = 1000 - allocated.reduce((sum, value) => sum + value, 0);
    const order = raw.map((value, index) => ({
      index,
      remainder: value - allocated[index]
    })).sort((a, b) => b.remainder - a.remainder || a.index - b.index);
    for (let i = 0; i < remaining; i++) allocated[order[i].index] += 1;
    return allocated;
  }

  function thumbUrl(id, size) {
    return `https://i.ytimg.com/vi/${encodeURIComponent(id)}/${size}.jpg`;
  }

  function thumb(id, large, title) {
    const a = document.createElement("a");
    a.className = large ? "thumb focus" : "";
    a.href = `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
    a.target = "_blank";
    a.rel = "noopener";
    if (!large) {
      const img = document.createElement("img");
      img.className = "mini";
      img.src = thumbUrl(id, "hqdefault");
      img.alt = title || "YouTube video";
      img.loading = "lazy";
      a.appendChild(img);
      return a;
    }
    const img = document.createElement("img");
    img.src = thumbUrl(id, "maxresdefault");
    img.alt = title || "YouTube video";
    img.loading = "lazy";
    img.onerror = () => {
      img.onerror = null;
      img.src = thumbUrl(id, "hqdefault");
    };
    a.appendChild(img);
    return a;
  }

  function render(data) {
    if (!data || !Array.isArray(data.acts) || data.acts.length === 0) {
      throw new Error("stats.json no contiene actos válidos.");
    }

    meta.textContent = `${data.total_acts} artistas · ${data.total_videos} vídeos · ${nf.format(data.total_views)} reproducciones · ${data.day}`;
    updated.textContent = data.updated_kst_text ? `Actualizado: ${data.updated_kst_text}` : "Datos aún no actualizados";
    demo.hidden = !data.demo;
    growthNote.textContent = data.growth_available
      ? "Vistas ganadas por artista · estimación de la última hora · actualización cada hora"
      : "Recopilando capturas para calcular las vistas ganadas por hora";
    app.innerHTML = "";

    const first = data.acts[0];
    const top = document.createElement("article");
    top.className = "top";
    const topline = document.createElement("div");
    topline.className = "topline";

    const no = document.createElement("div");
    no.className = "no";
    no.textContent = "N.º 1";

    const artist = document.createElement("div");
    artist.className = "artist";
    const artistName = document.createElement("div");
    artistName.className = "artist-name";
    artistName.textContent = first.artist;
    artist.appendChild(artistName);
    if (data.growth_available) {
      const growth = document.createElement("div");
      const growthAmount = Number(first.views_gained_last_hour) || 0;
      growth.className = "artist-growth " + (growthAmount < 0 ? "growth-negative" : growthAmount > 0 ? "" : "growth-neutral");
      growth.textContent = growthText(growthAmount);
      artist.appendChild(growth);
    }

    topline.append(no, artist);

    const views = document.createElement("div");
    views.className = "views";
    views.innerHTML = `${nf.format(first.views)} <span>reproducciones</span>`;

    const det = document.createElement("div");
    det.className = "detail";
    const totalViews = Number(data.total_views) || data.acts.reduce((sum, act) => sum + (Number(act.views) || 0), 0);
    const displayedShares = allocatePercentageTenths(data.acts.map(act => act.views), totalViews);
    const firstShare = displayedShares[0] / 10;
    const firstRawShare = totalViews > 0 ? (first.views / totalViews * 100) : 0;
    det.textContent = `${detail(first)} · ${firstShare.toFixed(1)}% del total`;

    const topShareTrack = document.createElement("div");
    topShareTrack.className = "top-share-track";
    const topShareFill = document.createElement("div");
    topShareFill.className = "top-share-fill";
    topShareFill.style.width = `${Math.max(0, Math.min(100, firstRawShare))}%`;
    topShareTrack.appendChild(topShareFill);

    const thumbs = document.createElement("div");
    thumbs.className = "thumbs";
    (first.video_list || []).forEach(v => thumbs.appendChild(thumb(v.id, true, v.title)));
    if (!first.video_list || first.video_list.length === 0) {
      const placeholder = document.createElement("div");
      placeholder.className = "thumb";
      placeholder.setAttribute("aria-label", "Sin miniaturas en datos de ejemplo");
      thumbs.appendChild(placeholder);
    }

    top.append(topline, views, det, topShareTrack, thumbs);
    app.appendChild(top);


    const rows = document.createElement("div");
    rows.className = "rows";

    data.acts.slice(1).forEach(act => {
      const row = document.createElement("article");
      row.className = "row";

      const rank = document.createElement("div");
      rank.className = "rank";
      rank.textContent = String(act.rank).padStart(2, "0");

      const name = document.createElement("div");
      name.className = "rowname";
      const rowartist = document.createElement("div");
      rowartist.className = "rowartist";
      rowartist.textContent = act.artist;
      if (data.growth_available) {
        const growth = document.createElement("div");
        const growthAmount = Number(act.views_gained_last_hour) || 0;
        growth.className = "row-growth " + (growthAmount < 0 ? "growth-negative" : growthAmount > 0 ? "" : "growth-neutral");
        growth.textContent = growthText(growthAmount);
        name.append(rowartist, growth);
      } else {
        name.appendChild(rowartist);
      }
      const rowdetail = document.createElement("div");
      rowdetail.className = "rowdetail";
      const actShare = totalViews > 0 ? (act.views / totalViews * 100) : 0;
      const displayedShare = displayedShares[data.acts.indexOf(act)] / 10;
      rowdetail.textContent = `${detail(act)} · ${displayedShare.toFixed(1)}% del total`;
      name.appendChild(rowdetail);

      const right = document.createElement("div");
      right.className = "right";
      const minis = document.createElement("div");
      minis.className = "mini-thumbs";
      (act.video_list || []).slice(0, 3).forEach(v => minis.appendChild(thumb(v.id, false, v.title)));
      const rowviews = document.createElement("div");
      rowviews.className = "rowviews";
      rowviews.textContent = nf.format(act.views);
      right.append(minis, rowviews);

      const barwrap = document.createElement("div");
      barwrap.className = "barwrap";
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.width = `${Math.max(0, Math.min(100, actShare))}%`;
      barwrap.appendChild(bar);

      row.append(rank, name, right, barwrap);
      rows.appendChild(row);
    });

    app.appendChild(rows);



    const collaborationTotal = Number(data.total_collaboration_views) ||
      data.acts.reduce((sum, act) => sum + (Number(act.collab_views) || 0), 0);
    const collaborationVideos = data.acts
      .flatMap(act => (act.video_list || [])
        .filter(video => video.collab)
        .map(video => ({ ...video, primaryArtist: act.artist })))
      .sort((a, b) => b.views - a.views);

    const collaborationShares = allocatePercentageTenths(
      collaborationVideos.map(video => video.views),
      collaborationTotal
    );

    if (collaborationVideos.length > 0 && collaborationTotal > 0) {
      const section = document.createElement("section");
      section.className = "collabs";
      const heading = document.createElement("h2");
      heading.textContent = "Vistas de colaboraciones";
      const intro = document.createElement("p");
      intro.className = "collabs-intro";
      intro.textContent = `Distribución de ${nf.format(collaborationTotal)} reproducciones entre vídeos colaborativos. Cada vídeo aparece una sola vez, aunque participen varios actos; el título muestra la colaboración completa. No se vuelve a sumar al ranking general.`;
      section.append(heading, intro);

      collaborationVideos.forEach((video, index) => {
        const row = document.createElement("div");
        row.className = "collab-row";
        const meta = document.createElement("div");
        meta.className = "collab-meta";
        const artistName = document.createElement("strong");
        artistName.textContent = video.primaryArtist;
        const percentage = document.createElement("strong");
        percentage.textContent = `${(collaborationShares[index] / 10).toFixed(1)}%`;
        meta.append(artistName, percentage);
        const title = document.createElement("a");
        title.className = "collab-title";
        title.href = `https://www.youtube.com/watch?v=${encodeURIComponent(video.id)}`;
        title.target = "_blank";
        title.rel = "noopener";
        title.textContent = video.title || "Abrir vídeo colaborativo en YouTube";
        const count = document.createElement("div");
        count.className = "collab-views";
        count.textContent = `${nf.format(video.views)} reproducciones`;
        const track = document.createElement("div");
        track.className = "collab-barwrap";
        const fill = document.createElement("div");
        fill.className = "collab-bar";
        fill.style.width = `${Math.max(0, Math.min(100, video.views / collaborationTotal * 100))}%`;
        track.appendChild(fill);
        row.append(meta, title, count, track);
        section.appendChild(row);
      });
      app.appendChild(section);
    }
  }

  async function load() {
    try {
      const response = await fetch(`stats.json?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      render(await response.json());
    } catch (error) {
      app.innerHTML = "";
      const box = document.createElement("div");
      box.className = "error";
      box.textContent = `No se pudieron cargar las estadísticas: ${error.message}`;
      app.appendChild(box);
    }
  }

  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
